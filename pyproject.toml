[project]
name = "onchain-alpha-atlas"
version = "0.1.0"
description = "Point-in-time cross-chain crypto factor research platform using Binance Web3 read-only data"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "tenacity>=8.2",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16.0",
  "duckdb>=1.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "plotly>=5.22",
  "matplotlib>=3.8",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
onchain-alpha = "onchain_alpha.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onchain_alpha"]
